    {

        "answer": 0
    },
    {
        "type": "judge",
        "title": "医用胶可用于胸腔镜手术止血、封闭微小漏气创面。",
        "options": ["错误", "正确"],
        "answer": 1
    },
    {
        "type": "judge",
        "title": "患者出院短期内可跑步、负重剧烈运动。",

const SETTING = {
    singleCount:30,
    multiCount:10,
    judgeCount:10,
    scorePerQuestion:2,
    totalMinutes:60
};
// ======================================================
let quizList = [];
let current = 0;
let userAnswers = [];
let timer = null;
let remainSeconds = 0;
let mode = "exam";
let popFlag = false; // 弹窗只弹出一次标记
const ERR_STORAGE_KEY = "exam_error_questions";

function getErrList(){
    const str = localStorage.getItem(ERR_STORAGE_KEY);
    return str ? JSON.parse(str) : [];
}
function saveErrList(list){
    localStorage.setItem(ERR_STORAGE_KEY, JSON.stringify(list));
}
function refreshErrCount(){
    document.getElementById("err-count").innerText = getErrList().length;
}
function addErrQuestion(q){
    const err = getErrList();
    if(!err.some(item=>item.title === q.title)){
        err.push(q);
        saveErrList(err);
    }
    refreshErrCount();
}
function removeErrByTitle(title){
    let err = getErrList();
    err = err.filter(item=>item.title !== title);
    saveErrList(err);
    refreshErrCount();
}
function clearAllErr(){
    if(confirm("确定清空全部错题库？不可恢复！")){
        saveErrList([]);
        refreshErrCount();
    }
}

function shuffle(arr){
    let a = [...arr];
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}
function getRandomItems(pool,n){
    return shuffle(pool).slice(0,n);
}
function formatTime(s){
    const m = Math.floor(s/60);
    const sec = s%60;
    return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function startTimer(){
    clearInterval(timer);
    remainSeconds = SETTING.totalMinutes*60;
    updateTimerView();
    timer = setInterval(()=>{
        remainSeconds--;
        updateTimerView();
        if(remainSeconds <=0){
            clearInterval(timer);
            alert("考试时间到，自动交卷！");
            submitPaper();
        }
    },1000);
}
function stopTimer(){ clearInterval(timer); }
function updateTimerView(){
    const el = document.getElementById("timer-text");
    if(mode === "err"){
        el.innerText = "错题练习无计时";
        el.classList.remove("timer-red");
        return;
    }
    el.innerText = formatTime(remainSeconds);
    el.classList.toggle("timer-red", remainSeconds <=60);
}

function submitPaper(){
    stopTimer();
    let rightCount = 0;
    const wrongQuestions = [];
    quizList.forEach((q,i)=>{
        const ua = userAnswers[i];
        let ok = false;
        if(q.type === "multi"){
            if(!Array.isArray(ua)) ok = false;
            else {
                const u = [...ua].sort();
                const std = [...q.answer].sort();
                ok = JSON.stringify(u) === JSON.stringify(std);
            }
        }else{
            ok = ua === q.answer;
        }
        if(ok){
            rightCount++;
            if(mode === "err") removeErrByTitle(q.title);
        }else wrongQuestions.push(q);
    });
    if(mode === "exam") wrongQuestions.forEach(q=>addErrQuestion(q));
    const score = rightCount * SETTING.scorePerQuestion;
    document.getElementById("quiz-area").classList.add("hide");
    document.getElementById("result-area").classList.remove("hide");
    if(mode === "exam"){
        document.querySelector(".score-text").innerText = `得分：${score}分 (${rightCount}/${quizList.length})`;
    }else{
        document.querySelector(".score-text").innerText = `错题练习完成 ${rightCount}/${quizList.length}`;
    }
    const detailWrap = document.getElementById("detail-wrap");
    detailWrap.innerHTML = "";
    const typeMap = {single:"单选",multi:"多选",judge:"判断"};
    quizList.forEach((q,i)=>{
        const ua = userAnswers[i];
        let userShow,stdShow,isOk;
        if(q.type === "multi"){
            if(!ua || !ua.length) userShow = "未作答";
            else userShow = ua.map(x=>q.options[x]).join("、");
            stdShow = q.answer.map(x=>q.options[x]).join("、");
            const u = ua ? [...ua].sort() : [];
            const std = [...q.answer].sort();
            isOk = JSON.stringify(u) === JSON.stringify(std);
        }else{
            userShow = ua !== undefined ? q.options[ua] : "未作答";
            stdShow = q.options[q.answer];
            isOk = ua === q.answer;
        }
        // 修复：定义字母数组
        const letterArr = ["A","B","C","D"];
        let optHtml = '<div style="margin:8px 0;">全部选项：<br>';
        q.options.forEach((optStr,idx)=>{
            optHtml += `<div class="opt-row">${letterArr[idx]}. ${optStr}</div>`;
        })
        optHtml += "</div>";

        const div = document.createElement("div");
        div.className = "answer-info";
        div.innerHTML = `
        <div><strong>【${typeMap[q.type]} 第${i+1}题】</strong>${q.title}</div>
        ${optHtml}
        <div>你的答案：${userShow}</div>
        <div>正确答案：${stdShow}</div>
        <div>${isOk ? "✅回答正确" : "❌回答错误"}</div>`;
        detailWrap.appendChild(div);
    });
}

function startExam(){
    mode = "exam";
    current = 0;
    userAnswers = [];
    popFlag = false; // 重置弹窗标记
    const singlePart = getRandomItems(singlePool, SETTING.singleCount);
    const multiPart = getRandomItems(multiPool, SETTING.multiCount);
    const judgePart = getRandomItems(judgePool, SETTING.judgeCount);
    quizList = [...singlePart,...multiPart,...judgePart];
    document.getElementById("home-area").classList.add("hide");
    document.getElementById("result-area").classList.add("hide");
    document.getElementById("quiz-area").classList.remove("hide");
    renderQuestion();
    startTimer();
}

function startErrPractice(){
    const errList = getErrList();
    if(errList.length === 0){
        alert("暂无错题，请先完成模拟考试！");
        return;
    }
    mode = "err";
    popFlag = true; // 错题模式不触发弹窗
    current = 0;
    userAnswers = [];
    quizList = shuffle(errList);
    document.getElementById("home-area").classList.add("hide");
    document.getElementById("result-area").classList.remove("hide");
    document.getElementById("quiz-area").classList.remove("hide");
    renderQuestion();
    updateTimerView();
}

function renderQuestion(){
    const item = quizList[current];
    const totalSingle = SETTING.singleCount;
    // 仅第一次到达30题才弹窗
    if(mode === "exam" && current === totalSingle && popFlag === false){
        alert("单选部分已全部完成，即将进入多选题！");
        popFlag = true;
    }
    const typeMap = {single:"单选题",multi:"多选题",judge:"判断题"};
    document.querySelector(".q-type-tag").innerText = typeMap[item.type];
    document.querySelector(".q-index span:last-child").innerText = `第 ${current+1} / ${quizList.length}`;
    document.querySelector(".q-text").innerText = item.title;
    const optWrap = document.getElementById("options-wrap");
    optWrap.innerHTML = "";
    // 控制清空按钮显示隐藏
    const clearMultiBtn = document.getElementById("clear-multi-btn");
    if(item.type === "multi"){
        clearMultiBtn.classList.remove("hide");
    }else{
        clearMultiBtn.classList.add("hide");
    }
    // 渲染分行选项
    item.options.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerText = opt;
        const ua = userAnswers[current];
        if(item.type === "multi"){
            if(Array.isArray(ua) && ua.includes(idx)) div.classList.add("active");
        }else{
            if(ua === idx) div.classList.add("active");
        }
        div.dataset.idx = idx;
        div.onclick = ()=>{
            if(item.type === "multi"){
                let sel = userAnswers[current] || [];
                const idxNum = Number(div.dataset.idx);
                if(sel.includes(idxNum)){
                    sel = sel.filter(x=>x!==idxNum);
                }else sel.push(idxNum);
                userAnswers[current] = sel;
            }else{
                userAnswers[current] = Number(div.dataset.idx);
            }
            renderQuestion();
        };
        optWrap.appendChild(div);
    });
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");
    if(current < quizList.length -1){
        nextBtn.classList.remove("hide");
        submitBtn.classList.add("hide");
    }else{
        nextBtn.classList.add("hide");
        submitBtn.classList.remove("hide");
    }
}

// 清空多选按钮
document.getElementById("clear-multi-btn").onclick = function(){
    userAnswers[current] = [];
    renderQuestion();
};

document.getElementById("next-btn").onclick = function(){
    const ans = userAnswers[current];
    if(ans === undefined || (Array.isArray(ans) && ans.length === 0)){
        alert("请选择答案！");
        return;
    }
    current++;
    renderQuestion();
};
document.getElementById("submit-btn").onclick = function(){
    stopTimer();
    submitPaper();
};
document.getElementById("restart-btn").onclick = function(){
    if(mode === "exam") startExam();
    else startErrPractice();
};
document.getElementById("back-home-btn").onclick = function(){
    stopTimer();
    document.getElementById("quiz-area").classList.add("hide");
    document.getElementById("home-area").classList.remove("hide");
    refreshErrCount();
};
document.getElementById("result-back-home-btn").onclick = function(){
    document.getElementById("result-area").classList.add("hide");
    document.getElementById("home-area").classList.remove("hide");
};
document.getElementById("start-exam-btn").onclick = startExam;
document.getElementById("start-err-btn").onclick = startErrPractice;
document.getElementById("clear-err-btn").onclick = clearAll;
window.onload = refreshErrCount;
</script>
